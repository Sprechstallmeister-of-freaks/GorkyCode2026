[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-tools-prototype"
version = "0.1.0"
description = "Provider-agnostic tools and lexical fallback search for a voice assistant"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
